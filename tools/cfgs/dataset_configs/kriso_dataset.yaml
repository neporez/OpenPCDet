DATASET: 'KrisoDataset'
DATA_PATH: '../data/kriso_ulsan'

POINT_CLOUD_RANGE: [-200, -200, -40, 200, 200, 40]

# 7: yaw-only boxes, 9: [.., yaw, roll, pitch] (needs the tilt head in the model)
BOX_DOF: 9
# which boxes count as labels (pcdet/utils/visibility_utils.py): points >= ABS_POINTS, or
# points / expected >= RATIO with expected = C * visible_area / distance^2 and C = 1 / (azimuth step * elevation step)
# from SENSOR (real LiDAR: Ouster OS2-128, 2048 x 10 mode, 22.5 deg vertical FOV -> C = 105,413 points/sr), i.e. RATIO is
# the share of the theoretically possible returns (median of the real labels 0.23).
# The same rule is used for training labels, for the gt_sampling database and (EVAL_IGNORE_NON_LABELS) for evaluation.
LABEL_FILTER: {
    RATIO: 0.1,
    ABS_POINTS: 50,
    SENSOR: {CHANNELS: 128, V_FOV_DEG: 22.5, COLUMNS: 2048}
}
# TRAINING rule (training labels + gt_sampling database); evaluation ALWAYS uses LABEL_FILTER above. Same as LABEL_FILTER by
# default; override per run, e.g. --set DATA_CONFIG.TRAIN_LABEL_FILTER.RATIO 0.2 DATA_CONFIG.TRAIN_LABEL_FILTER.ABS_POINTS 1000000000
TRAIN_LABEL_FILTER: {
    RATIO: 0.1,
    ABS_POINTS: 50,
    SENSOR: {CHANNELS: 128, V_FOV_DEG: 22.5, COLUMNS: 2048}
}
# multi-frame accumulation (2026-11-12): NUM_FRAMES 1 = off; 3 = frame + previous + next labelled frame of the same scene
# (ulsan_1105 only, ICP scene poses in ImageSets/scene_poses_1105.csv), in training AND evaluation.
# Override per run: --set DATA_CONFIG.ACCUMULATE.NUM_FRAMES 3
ACCUMULATE: {NUM_FRAMES: 1, POSES: scene_poses_1105.csv}
# boxes that are not labels: removed from training, "don't care" in evaluation (neither missed nor false positive)
EVAL_IGNORE_NON_LABELS: True
# GT outside POINT_CLOUD_RANGE is dropped from evaluation because the model cannot predict it
EVAL_FILTER_GT_BY_RANGE: True
# > 0: gt boxes longer than this (m) are "don't care" in evaluation (cross_site_val: jangsaeng's > 40 m ships have no
# counterpart in the training site; set with --set DATA_CONFIG.EVAL_IGNORE_LENGTH_ABOVE 40.0); -1 = off
EVAL_IGNORE_LENGTH_ABOVE: -1.0
# TP / FP / FN tables (and tensorboard TP_ / FP_ / FN_ values) are counted at this score threshold (AP uses all thresholds)
EVAL_COUNT_SCORE_THRESH: 0.3
# True: 7-DoF predictions are padded with roll = pitch = 0 and scored with the 6-DoF IoU against the tilted gt
# (False: a 7-DoF prediction is scored with the yaw-only IoU, the gt tilt is ignored)
EVAL_FORCE_6DOF: False
NUM_POINT_FEATURES: 3

# kriso_ulsan: final real data (ulsan 0609 1,077 frames + ulsan 1105 1,587 frames), 5-fold cross validation.
# pick the fold with --set DATA_CONFIG.DATA_SPLIT.train fold<k>_train DATA_CONFIG.DATA_SPLIT.test fold<k>_val
# (folds built by `python -m pcdet.datasets.kriso.make_folds`; membership in ImageSets/folds.csv)
DATA_SPLIT: {
    'train': fold0_train,
    'test': fold0_val
}

